<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SynDay 共時</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SynDay">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, premium — the restraint of Threads and Instagram
   IDEA: a monochrome messenger + feed where the characters are the only colour
   PICTURE: the working app itself — bubbles, posts, cycle bar
   COLOUR and TYPE: pure white / pure black, greys, one accent (#ff3040) for likes, unread, cycle; Inter + Noto Sans TC, light weights
   LAYOUT: one phone column ≤520px, hairline dividers, icon-only tab bar */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#000000);--sf:light-dark(#f3f3f3,#161616);--sf2:light-dark(#e7e7e7,#262626);--ink:light-dark(#0a0a0a,#f5f5f5);--mut:light-dark(#8e8e8e,#7a7a7a);--line:light-dark(#ececec,#1f1f1f);--acc:#ff3040;--meb:light-dark(#0a0a0a,#f5f5f5);--met:light-dark(#ffffff,#0a0a0a);--other:light-dark(#efefef,#1e1e1e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Inter,"Noto Sans TC",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
button,input,textarea,select{font-family:inherit;color:inherit;letter-spacing:inherit}
#app{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:560px){#app{border-inline:1px solid var(--line)}}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;gap:4px;padding:8px 8px 8px 20px;min-height:60px;border-bottom:1px solid var(--line)}
header h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0;flex:1;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{font-size:12px;font-weight:400;color:var(--mut);margin-left:8px}
header.sub{padding-left:4px}header.sub h1{font-size:16px;font-weight:600;text-align:center;padding-right:44px}
main{flex:1;padding-bottom:96px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;color:var(--mut);padding:0;display:grid;place-items:center;min-height:60px;cursor:pointer;position:relative}
nav.tabs button.on{color:var(--ink)}nav.tabs button.on svg{stroke-width:2.2}
nav.tabs svg{width:27px;height:27px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dot{position:absolute;top:14px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--acc)}
svg{display:block}
.btn{border:0;border-radius:12px;padding:10px 20px;font-weight:600;font-size:15px;background:var(--meb);color:var(--met);min-height:44px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--sf2)}.btn.warn{background:var(--acc);color:#fff}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.35;cursor:default}
.icon{background:none;border:0;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;cursor:pointer;flex:none;color:var(--ink)}
.icon:hover{background:var(--sf)}.icon svg{width:24px;height:24px}
.icon.pri{color:var(--ink)}.icon.pri:hover{background:none}.icon:disabled{opacity:.3}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ink);background:var(--sf2);font-weight:500;font-size:18px;background-size:cover;background-position:center;position:relative}
.av.me{background:var(--meb);color:var(--met)}
.av.s{width:34px;height:34px;font-size:13px}.av.l{width:96px;height:96px;font-size:34px;font-weight:400}
.stackav{position:relative;width:48px;height:48px;flex:none}.stackav .av{position:absolute;width:33px;height:33px;font-size:13px;box-shadow:0 0 0 2px var(--bg)}.stackav .av:first-child{top:0;left:0}.stackav .av:last-child{bottom:0;right:0}
.row{display:flex;gap:14px;align-items:center;padding:12px 20px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit}
.row:hover{background:var(--sf)}
.row .t{flex:1}.row b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .p{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row.unread .p{color:var(--ink);font-weight:500}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:flex-start;padding-top:3px}
.row time{font-size:12px;color:var(--mut);white-space:nowrap}
.pill{background:var(--acc);color:#fff;border-radius:999px;font-size:11px;min-width:20px;height:20px;padding:0 6px;font-weight:600;display:grid;place-items:center;white-space:nowrap}
.empty{padding:72px 32px;text-align:center}.empty h2{font-size:20px;font-weight:600;margin:22px 0 6px}.empty p{color:var(--mut);margin:0 0 24px;font-size:14px}
.empty .art{width:120px;height:90px;margin:0 auto;color:var(--ink)}
/* chat */
.chat{padding:16px 14px 18px;display:flex;flex-direction:column;gap:3px;background:var(--bg);min-height:calc(100dvh - 156px);justify-content:flex-end}
.daysep{align-self:center;font-size:11px;color:var(--mut);margin:14px 0 8px;font-weight:500}
.m{display:flex;gap:8px;align-items:flex-end;max-width:84%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m:not(.cont){margin-top:8px}
.m .col{display:flex;flex-direction:column}
.m .who{font-size:12px;color:var(--mut);margin:0 0 3px 12px}
.m .bb{padding:9px 15px;border-radius:20px;background:var(--other);white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5}
.m.me .bb{background:var(--meb);color:var(--met)}
.m.cont .av{visibility:hidden}.m.cont .who{display:none}
.m .meta{font-size:10px;color:var(--mut);white-space:nowrap;line-height:1.3;text-align:right;padding-bottom:2px}
.typing .bb{display:flex;gap:4px;padding:15px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:bl 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){.typing i{animation:none}}
.inbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;gap:2px;align-items:flex-end;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:6}
.inbar textarea{flex:1;resize:none;border:1px solid var(--sf2);background:transparent;border-radius:22px;padding:10px 16px;font-size:16px;line-height:1.4;max-height:120px;min-height:44px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--ink)!important}
/* feed */
.compose{display:flex;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.compose .nm{font-weight:600;font-size:15px;line-height:1.3;padding-top:2px}
.compose textarea{width:100%;border:0!important;background:none;resize:none;font-size:15px;padding:2px 0 6px;min-height:44px;line-height:1.5}
.compose .bar{display:flex;justify-content:space-between;align-items:center;margin-left:-10px}
.compose .bar .icon{color:var(--mut)}
.post{display:flex;gap:12px;padding:16px 20px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.post .lft{display:flex;flex-direction:column;align-items:center}
.post .ln{flex:1;width:2px;background:var(--line);margin-top:8px;border-radius:2px}
.post .body{flex:1}.post .h{display:flex;gap:8px;align-items:baseline}.post .h b{font-size:15px;font-weight:600}.post .h time{color:var(--mut);font-size:14px;white-space:nowrap;margin-left:auto}
.post .tx{white-space:pre-wrap;overflow-wrap:anywhere;margin:2px 0 6px;font-size:15px}
.acts{display:flex;gap:2px;color:var(--ink);margin-left:-10px}
.acts button{background:none;border:0;color:inherit;display:flex;align-items:center;gap:5px;font-size:13px;min-height:40px;padding:0 10px;border-radius:999px;cursor:pointer}
.acts button:hover{background:var(--sf)}.acts svg{width:21px;height:21px}
.acts .liked{color:var(--acc)}.acts .liked path{fill:currentColor}
.cm{display:flex;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}.cm .tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.cm b{font-size:14px;font-weight:600}.cm time{font-size:13px;color:var(--mut);margin-left:8px}
.wait{padding:14px 20px;color:var(--mut);font-size:14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.pimgs{display:grid;gap:4px;margin:8px 0;border-radius:12px;overflow:hidden;grid-template-columns:repeat(2,minmax(0,1fr))}
.pimgs.n1{grid-template-columns:1fr}
.pimgs img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in;background:var(--sf)}
.pimgs.n1 img{aspect-ratio:auto;max-height:440px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.thumbs div{position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;display:block}
.thumbs button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;line-height:1}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:30;padding:16px;cursor:zoom-out}
#lb.on{display:grid}#lb img{max-width:100%;max-height:100%;border-radius:6px}
/* characters */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:20px}
.card{background:none;border:1px solid var(--line);border-radius:18px;padding:22px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;min-height:184px;font:inherit}
.card:hover{border-color:var(--sf2);background:var(--sf)}
.card b{font-size:15px;font-weight:600;margin-top:6px}.card span{font-size:13px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.add{border-style:dashed;border-color:var(--sf2);justify-content:center;color:var(--mut);font-weight:500}
.card.add svg{width:30px;height:30px}
.form{padding:20px;display:flex;flex-direction:column;gap:18px}
.form label{font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:6px}
.form label em{font-style:normal;font-weight:400;color:var(--mut);font-size:12px;line-height:1.5}
.form input[type=text],.form input[type=password],.form input[type=date],.form input[type=number],.form textarea,.form select{border:1px solid var(--sf2);background:transparent;border-radius:12px;padding:11px 14px;font-size:16px;font-weight:400;min-height:46px;width:100%}
.form textarea{min-height:220px;resize:vertical;line-height:1.6}
.avedit{display:flex;gap:18px;align-items:center}
.sw{display:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:12px!important;font-weight:400!important;font-size:15px!important;padding:6px 0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ink)}
/* me / period */
.sec{padding:24px 20px;border-bottom:1px solid var(--line)}
.sec h2{font-size:13px;font-weight:600;margin:0 0 14px;color:var(--mut)}
.cyc{border:1px solid var(--line);border-radius:20px;padding:22px 20px 18px}
.cyc .big{font-size:clamp(36px,11vw,52px);font-weight:300;letter-spacing:-.02em;line-height:1.05;margin:4px 0 8px}
.cyc .lbl{font-size:13px;font-weight:600;color:var(--acc)}
.cyc .subt{font-size:13px;color:var(--mut)}
.bar{display:flex;gap:2px;margin:20px 0 8px;height:26px}
.bar i{flex:1;border-radius:3px;background:var(--sf)}
.bar i.pp{background:var(--acc)}.bar i.td{background:var(--ink)}.bar i.pp.td{box-shadow:inset 0 0 0 2px var(--ink)}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.hist span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap;color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin:12px 0 0;line-height:1.6}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--meb);color:var(--met);padding:10px 18px;border-radius:12px;font-size:14px;max-width:min(90vw,440px);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.loading{padding:80px 20px;text-align:center;color:var(--mut)}
.mimg{max-width:min(230px,62vw);max-height:300px;border-radius:18px;display:block;cursor:zoom-in;object-fit:cover;background:var(--sf)}
.m .col{align-items:flex-start;gap:3px}.m.me .col{align-items:flex-end}
.m .gone{font-size:13px;color:var(--mut);padding:9px 15px;border-radius:20px;border:1px dashed var(--sf2)}
.hc{position:absolute;top:2px;left:12%;font-size:11px;color:var(--acc);font-style:normal;line-height:1;pointer-events:none}
.day .care{margin:10px 0 0}.day .cares{margin-top:14px}
.day .soon{margin:12px 0 0;border:1px dashed var(--sf2);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--mut)}
.pick{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:496px;background:var(--bg);border:1px solid var(--sf2);border-radius:18px;padding:14px;z-index:8;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.pick .q{font-size:13px;color:var(--mut);margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m .bb{cursor:pointer}.m .bb.on{outline:2px solid var(--ink);outline-offset:2px}
.pst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 10px}.pst div{background:var(--sf);border-radius:12px;padding:10px 12px}.pst small{display:block;font-size:12px;color:var(--mut)}.pst b{font-size:22px;font-weight:600;white-space:nowrap}.pst i{font-style:normal;font-size:12px;font-weight:400;margin-left:2px;color:var(--mut)}.pst em{display:block;font-style:normal;font-size:11px;color:var(--mut)}
.tc{border:1px solid var(--line);border-radius:16px;padding:14px 14px 8px;margin-top:10px}
.tc .th{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}.tc .th b{font-weight:600}.tc .th span{font-size:12px;color:var(--mut);text-align:right}
.chart{width:100%;height:auto;display:block}
.dots{display:flex;gap:3px;flex-wrap:wrap;padding:6px 0 8px}.dots i{flex:1;min-width:6px;max-width:28px;height:18px;border-radius:4px;background:var(--sf)}.dots i.on{background:var(--ink)}
.wtr{display:flex;align-items:center;gap:12px}.wv{flex:1}.wv b{font-size:24px;font-weight:600}.wv small{margin-left:8px;color:var(--mut);font-size:12px}
.wbar{height:6px;border-radius:3px;background:var(--sf);margin-top:6px;overflow:hidden}.wbar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.slp{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.slp label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);flex:1 1 120px}
.slp input,.form input#cx-name,.form input#cx-unit{border:1px solid var(--sf2);background:transparent;border-radius:12px;padding:9px 12px;font-size:16px;min-height:44px;width:100%;color:var(--ink)}.slp .sh{font-size:14px;font-weight:600;padding-bottom:12px;white-space:nowrap}
.stkm{width:130px;height:130px;display:grid;place-items:center}.stkm img{max-width:130px;max-height:130px;display:block}.stkm .se{font-size:92px;line-height:1}
.stkd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(61px + env(safe-area-inset-bottom));width:100%;max-width:520px;height:min(300px,42vh);background:var(--bg);border-top:1px solid var(--line);z-index:7;display:flex;flex-direction:column}
.stkd .tabs2{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
.stkd .grid2{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px}
.stkd .s{position:relative;border:0;background:none;border-radius:14px;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;padding:4px}.stkd .s:hover{background:var(--sf)}
.stkd .s img{max-width:100%;max-height:100%}.stkd .s .se{font-size:44px;line-height:1}.stkd .s small{position:absolute;bottom:0;left:0;right:0;font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stkd .s .x{position:absolute;top:0;right:0;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;display:grid;place-items:center}
.stkd .add{border:1.5px dashed var(--sf2);border-radius:14px;aspect-ratio:1;display:grid;place-items:center;color:var(--mut);font-size:13px;cursor:pointer;text-align:center;padding:4px}
.stkd .newf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}.stkd .newf img{width:48px;height:48px;object-fit:contain;background:var(--sf);border-radius:10px}.stkd .newf input{flex:1;border:1px solid var(--sf2);background:transparent;border-radius:10px;padding:8px 12px;font-size:16px;color:var(--ink);min-height:40px}
.av.xs{width:22px;height:22px;font-size:10px;box-shadow:0 0 0 2px var(--bg)}
.rep{display:flex;align-items:center;gap:8px;margin:2px 0 4px;color:var(--mut);font-size:13px}
.rep .avs{display:flex}.rep .avs .av{margin-right:-6px}.rep .avs .av:last-child{margin-right:0}
.cm .to{font-size:12px;color:var(--mut);margin-left:6px}
.cm .rb{background:none;border:0;color:var(--mut);font-size:13px;padding:6px 0 0;cursor:pointer;min-height:32px}
.more{display:block;margin:14px auto 4px}
.sumc{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:20px 20px 6px}
.sumc .big{font-size:clamp(30px,9vw,40px);font-weight:300;letter-spacing:-.02em;line-height:1.05;margin:4px 0 4px}
.sumc .lbl{font-size:13px;font-weight:600;color:var(--acc)}
.sumc .subt{font-size:13px;color:var(--mut)}
.care{display:flex;gap:12px;margin:14px 20px 4px;border:1px solid var(--line);border-radius:16px;padding:14px}
.care .body{flex:1}.care .btn{align-self:flex-start}.care b{font-size:14px;font-weight:600}.care time{font-size:12px;color:var(--mut);margin-left:6px}
.care .tx{white-space:pre-wrap;font-size:14px;margin-top:2px}
.cal{padding:8px 14px 0}
.calh{display:flex;align-items:center;justify-content:space-between;padding:4px 0 6px}
.calh b{font-size:17px;font-weight:600}
.wk,.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.wk span{font-size:12px;color:var(--mut);padding:6px 0}
.cd{aspect-ratio:1;border:0;background:none;display:grid;place-items:center;position:relative;cursor:pointer;padding:0;font-size:15px;color:var(--ink)}
.cd span{width:min(40px,90%);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1.5px solid transparent}
.cd.pp span{background:var(--acc);color:#fff}
.cd.pred span{border:1.5px dashed var(--acc);color:var(--acc)}
.cd.ov span{border:1.5px dashed var(--mut)}

function line(vals,labels,opt={}){const W=340,H=150,pl=34,pr=10,pt=14,pb=22,n=vals.length,pts=vals.map((v,i)=>v==null?null:[i,v]).filter(Boolean);

document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='like'||b.dataset.act==='zoom'||b.dataset.act==='rmPhoto'||b.closest('.acts'))e.stopPropagation();const f=act[b.dataset.act];if(f){if(b.tagName!=='INPUT')e.preventDefault();f(b.dataset.id,b,e)}});
app.addEventListener('input',e=>{const t=e.target;if(t.id==='c-pf'||t.id==='c-cs'||t.id==='c-emo'||t.id==='c-gen'){drafts[t.id]=t.value;return}if(t.id==='c-pro')drafts[t.id]=t.checked;else if(t.id==='imp')return;else if(t.id&&t.type!=='file'&&t.type!=='checkbox'&&t.tagName!=='SELECT')drafts[t.id]=t.value;if(t.closest('.inbar'))grow(t);
  if(t.id==='c-mem'){const el=$('#c-mcount');if(el)el.textContent=cnt(t.value,MMAX)}
  if(t.id==='c-persona'){const el=$('#c-pcount');if(el)el.textContent=cnt(t.value,PMAX)}
  if(t.id==='c-ref'){const el=$('#c-rcount');if(el)el.textContent=cnt(t.value,RMAX)}
  if(t.id==='c-name'&&!formImg){const a=$('#c-av');if(a)a.textContent=(t.value||'?').slice(0,1)}});
app.addEventListener('change',e=>{const t=e.target;
  if(t.id==='me-gen'){S.profile.gender=t.value;save('profile','p');toast('已設定')}
  if(t.id==='me-name'){S.profile.me=t.value.trim();delete drafts['me-name'];save('profile','p')}
  if((t.id==='c-pfile'||t.id==='c-rfile')&&t.files[0]){const f=t.files[0],isP=t.id==='c-pfile',key=isP?'c-persona':'c-ref',max=isP?PMAX:RMAX;
    toast('讀取檔案中…');
    readFile(f).then(txt=>{if(!txt){toast('這個檔案裡沒有讀到文字');return}
      const cur=(document.getElementById(key)?.value||'').trim();let v=cur?cur+'\n\n'+txt:txt;
      if(v.length>max){v=isP?v.slice(0,max):v.slice(-max);toast(isP?`人設太長，只保留前 ${max.toLocaleString()} 字`:`對話太長，保留最新的 ${max.toLocaleString()} 字`)}else toast(`已匯入「${f.name}」`);
      drafts[key]=v;render()}).catch(()=>toast('這個檔案讀不出來，試試 .txt 或 Word 檔'));t.value=''}
  if(t.id==='chat-file'&&t.files.length&&V.sub&&V.sub.k==='conv'){const id=V.sub.id,fs=[...t.files].filter(f=>f.type.startsWith('image/')).slice(0,4);t.value='';
    if(t.files.length>4)toast('一次最多傳 4 張');
    (async()=>{for(const f of fs){try{const u=await shrink(f,1280,180000);push(id,'me','',u);save('convs',id);render();window.scrollTo(0,document.body.scrollHeight)}catch(e){toast('有照片讀不出來，換一張試試')}}schedReply(id,2200)})()}
  if(t.id==='me-file'&&t.files[0]){const f=t.files[0];t.value='';const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=200;const x=cv.getContext('2d'),q=Math.min(im.width,im.height);x.drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,200,200);S.profile.img=cv.toDataURL('image/jpeg',.85);save('profile','p');render();toast('大頭貼換好了')};im.onerror=()=>toast('這張圖片讀不出來');im.src=fr.result};fr.readAsDataURL(f)}
  if(t.id==='d-sb'||t.id==='d-sw'){const d=V.selDay||today(),L=dlog()[d]||(dlog()[d]={});L[t.id==='d-sb'?'sb':'sw']=t.value;tidy(d);save();render()}
  if(t.id==='d-wt'){const d=V.selDay||today(),L=dlog()[d]||(dlog()[d]={});const v=parseFloat(t.value);if(isFinite(v)&&v>=20&&v<=300)L.wt=Math.round(v*10)/10;else delete L.wt;tidy(d);save();render()}
  if(t.classList&&t.classList.contains('cxv')){const d=V.selDay||today(),L=dlog()[d]||(dlog()[d]={}),id=t.dataset.id,it=hcfg().items.find(x=>x.id===id);L.cx=L.cx||{};
    if(it&&it.type==='num'){const v=parseFloat(t.value);if(isFinite(v))L.cx[id]=v;else delete L.cx[id]}else{const v=t.value.trim();if(v)L.cx[id]=v.slice(0,300);else delete L.cx[id]}tidy(d);save();if(it&&it.type==='num')render()}
  if(t.id==='stk-file'&&t.files[0]){const f=t.files[0];t.value='';const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,240/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*sc));cv.height=Math.max(1,Math.round(im.height*sc));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);let u=cv.toDataURL('image/png');if(u.length>140000)u=cv.toDataURL('image/webp',0.85);if(!/^data:image\/(png|webp)/.test(u)||u.length>140000)u=cv.toDataURL('image/jpeg',0.85);V.stkNew=u;render();setTimeout(()=>{const el=$('#stk-name');if(el)el.focus()},50)};im.onerror=()=>toast('這張圖片讀不出來');im.src=fr.result};fr.readAsDataURL(f)}
  if(t.id==='d-note'){const d=V.selDay||today(),L=dlog()[d]||(dlog()[d]={});L.note=t.value.trim();delete drafts['d-note'];tidy(d);save()}
  if(t.id==='q-on'||t.id==='q-from'||t.id==='q-to'){const q=quietCfg();if(t.id==='q-on')q.on=t.checked;else q[t.id==='q-from'?'from':'to']=+t.value;S.profile.quiet=q;
    if(S.pushq){const now=Date.now();S.pushq=S.pushq.filter(x=>x.at<=now||!inQuiet(x.at))}save();render();syncPush();planPush()}
  if(t.id==='pro-freq'&&S.pushq){S.pushq=S.pushq.filter(x=>x.at<=Date.now())}
  if(t.id==='ai-model'){AI.model=t.value;saveAI();noAIUntil=0;toast(t.value===DEF_LITE||t.value===DEF_FLASH?'已換模型':'注意：這個模型可能要付費。角色沒回話或被收費的話，請換回 Flash-Lite')}
  if(t.id==='imp'&&t.files[0]){t.files[0].text().then(x=>{const d=JSON.parse(x);if(!d||typeof d!=='object'||!d.chars)throw 0;impData=d;render()}).catch(()=>toast('這不是 SynDay 的備份檔'));t.value=''}
  if(t.id==='pro-freq'){S.profile.pro=t.value;save('profile','p');toast(t.value==='off'?'角色不會主動傳訊息了':'已設定');proCheck();syncPush();planPush()}
  if(t.id==='post-file'&&t.files.length){const room=4-postFiles.length;const fs=[...t.files].filter(f=>f.type.startsWith('image/')).slice(0,Math.max(0,room));
    if(t.files.length>room)toast('一篇最多 4 張照片');fs.forEach(f=>postFiles.push({file:f,url:URL.createObjectURL(f)}));render()}
  if(t.id==='c-file'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=160;const x=cv.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);formImg=cv.toDataURL('image/jpeg',.85);render()};im.onerror=()=>toast('這張圖片讀不出來');im.src=fr.result};fr.readAsDataURL(t.files[0])}});
app.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.shiftKey||e.isComposing||e.keyCode===229)return;
  if(window.matchMedia('(pointer:coarse)').matches)return;
  const id=e.target.id;if(id?.startsWith('in-cm-')){e.preventDefault();sendComment()}else if(id==='in-post'){}else if(id?.startsWith('in-')){e.preventDefault();sendMsg()}});
initStore();
}
</script></body></html>
